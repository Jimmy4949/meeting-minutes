<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LE Minutes">
<meta name="theme-color" content="#14181c">
<title>Lake Effect Meeting Minutes</title>
<style>
:root{--bg:#14181c;--panel:#1d2329;--line:#2c343c;--text:#eef1f3;--muted:#98a3ad;--red:#e5484d;--ok:#3fb27f;--accent:#d9b25f;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 18px 40px;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
.top{display:flex;align-items:center;gap:10px}.top button{margin-left:auto}
input[type=text]{width:100%;font:inherit;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;padding:9px;border-radius:9px}
.seg button[aria-pressed=true]{background:var(--line);color:var(--text);font-weight:600}
.rec{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 6px}
.clock{font-size:46px;font-variant-numeric:tabular-nums;font-weight:300;letter-spacing:.02em}
.state{color:var(--muted);font-size:14px;min-height:20px}
.big{width:120px;height:120px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(229,72,77,.15)}
.big.live{animation:pulse 1.6s infinite}
.big svg{width:46px;height:46px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}70%{box-shadow:0 0 0 22px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:12px 18px;border-radius:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1405;font-weight:650}
.btn.ghost{background:none;color:var(--muted)}
.btn.sm{padding:7px 12px;font-size:14px}
.transcript{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:38vh;overflow:auto;font-size:15px;white-space:pre-wrap}
.transcript .interim{color:var(--muted)}
.note{border-radius:12px;padding:12px 14px;font-size:14px;border:1px solid var(--line);background:var(--panel)}
.note.err{border-color:#6b2a2c;background:#2a1718}.note.ok{border-color:#245c43;background:#132a20}
.muted{color:var(--muted)}.small{font-size:14px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.hidden{display:none!important}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Lake Effect Meeting Minutes</h1><button class="btn sm ghost" id="setBtn">Settings</button></div>

  <section id="settings" class="note hidden">
    <label for="url">Inbox web app URL</label><input type="text" id="url" placeholder="https://script.google.com/macros/s/…/exec">
    <div style="height:10px"></div>
    <label for="key">Secret key</label><input type="text" id="key" autocomplete="off">
    <div style="height:12px"></div>
    <div class="row" style="justify-content:flex-start"><button class="btn primary sm" id="saveSet">Save</button><button class="btn sm" id="testSet">Test connection</button></div>
    <p class="small muted" id="setMsg"></p>
  </section>

  <section id="setup">
    <label for="title">Meeting title</label>
    <input type="text" id="title" placeholder="e.g. 4401 receiving huddle">
    <div style="height:10px"></div>
    <div class="seg" role="group" aria-label="Type"><button data-type="meeting" aria-pressed="true">Business meeting</button><button data-type="training" aria-pressed="false">Training</button></div>
  </section>

  <section class="rec">
    <div class="clock" id="clock">0:00</div>
    <div class="state" id="state">Ready</div>
    <button class="big" id="big" aria-label="Start recording"></button>
    <div class="row" id="controls"></div>
  </section>

  <div id="msg"></div>
  <div class="transcript hidden" id="tx"></div>
  <p class="small muted" id="tip">Keep this screen open and unlocked while recording. Put the phone face-up in the middle of the table.</p>
</main>
<script>
const MIC='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.92V21h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2.08A7 7 0 0 1 5 12a1 1 0 1 1 2 0 5 5 0 0 0 10 0Z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const $=s=>document.querySelector(s);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

// One-time setup link: ?u=<web app url>&k=<secret>
(function(){const p=new URLSearchParams(location.search);const u=p.get("u"),k=p.get("k");
  if(u||k){const c=store.get("mr-conf")||{};if(u)c.url=u;if(k)c.key=k;store.set("mr-conf",c);history.replaceState(null,"",location.pathname);}})();
const conf=()=>store.get("mr-conf")||{};

let S={status:"idle",type:"meeting",segs:[],interim:"",startedAt:0,acc:0,id:null,recog:null,restarts:0,lastRestart:0,pending:store.get("mr-pending")||[]};
const draft=store.get("mr-cap-draft");
if(draft&&draft.segs&&draft.segs.length){Object.assign(S,{status:"paused",segs:draft.segs,acc:draft.acc||0,id:draft.id,type:draft.type||"meeting",startedIso:draft.startedIso});$("#title").value=draft.title||"";}

function elapsed(){return S.acc+(S.status==="recording"?(Date.now()-S.startedAt)/1000:0)}
function fmt(t){t=Math.floor(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")}
function saveDraft(){store.set("mr-cap-draft",{segs:S.segs,acc:elapsed(),id:S.id,type:S.type,title:$("#title").value,startedIso:S.startedIso})}
function msg(html,kind){$("#msg").innerHTML=html?`<div class="note ${kind||""}">${html}</div>`:""}

function startRecog(){
  const r=new SR();r.continuous=true;r.interimResults=true;r.lang="en-US";
  r.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i],t=(res[0]&&res[0].transcript||"").trim();
      if(res.isFinal){if(t){S.segs.push({t:elapsed(),text:t});saveDraft();}}else interim+=t+" ";}
    S.interim=interim.trim();renderTx();};
  r.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){fail("Microphone or speech recognition is blocked. On iPhone: Settings → Safari → Microphone → Allow, and Settings → Privacy → Speech Recognition. On Android: tap the lock icon in Chrome's address bar → Microphone → Allow.");}
    else if(e.error==="audio-capture"){fail("No microphone was found.");}
    else if(e.error==="network"){msg("Speech service lost the connection – retrying…","err");}
  };
  r.onend=()=>{if(S.status==="recording"&&S.recog===r){const now=Date.now();S.restarts=(now-S.lastRestart<2000)?S.restarts+1:0;S.lastRestart=now;
      if(S.restarts>8){pause();msg("Transcription keeps stopping. Check your signal, then tap the button to resume.","err");return;}
      try{r.start()}catch{}}};
  S.recog=r;r.start();
}
function stopRecog(){const r=S.recog;S.recog=null;if(r){r.onend=null;try{r.stop()}catch{}}}
function fail(t){stopRecog();S.acc=elapsed();S.status=S.segs.length?"paused":"idle";msg(esc(t),"err");render();}

let wake=null,tick=null;
async function keepAwake(on){try{if(on&&"wakeLock" in navigator)wake=await navigator.wakeLock.request("screen");else if(!on&&wake){await wake.release();wake=null}}catch{}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.status==="recording"){keepAwake(true);if(!S.recog)try{startRecog()}catch{}}});

function start(){
  if(!SR){msg("This browser can't transcribe speech. Open this page in Safari (iPhone) or Chrome (Android).","err");return;}
  if(!conf().url||!conf().key){msg("Finish setup first: tap Settings and enter the inbox URL and key (or open your setup link).","err");return;}
  if(!$("#title").value.trim()){$("#title").focus();msg("Give the meeting a title first.","err");return;}
  msg("");S.id=S.id||("rec-"+Date.now()+"-"+Math.random().toString(36).slice(2,7));S.startedIso=S.startedIso||new Date().toISOString();
  S.startedAt=Date.now();S.status="recording";
  try{startRecog()}catch(e){fail("Couldn't start the microphone: "+e.message);return;}
  keepAwake(true);clearInterval(tick);tick=setInterval(()=>{$("#clock").textContent=fmt(elapsed())},500);saveDraft();render();
}
function pause(){S.acc=elapsed();S.status="paused";stopRecog();if(S.interim){S.segs.push({t:S.acc,text:S.interim});S.interim="";}keepAwake(false);saveDraft();render();}
function discard(){if(!confirm("Throw away this recording?"))return;stopRecog();keepAwake(false);clearInterval(tick);store.del("mr-cap-draft");S=Object.assign(S,{status:"idle",segs:[],interim:"",acc:0,id:null,startedIso:null});msg("");render();}

function transcriptText(segs){return segs.map(s=>`[${fmt(s.t)}] ${s.text}`).join("\n")}
async function finish(){
  if(S.status==="recording")pause();
  if(!S.segs.length){msg("Nothing was transcribed yet.","err");return;}
  const rec={id:S.id,title:$("#title").value.trim()||"Untitled meeting",type:S.type,startedAt:S.startedIso,durationSec:Math.round(S.acc),transcript:transcriptText(S.segs)};
  S.pending=S.pending.filter(p=>p.id!==rec.id).concat(rec);store.set("mr-pending",S.pending);
  store.del("mr-cap-draft");clearInterval(tick);
  S=Object.assign(S,{status:"idle",segs:[],interim:"",acc:0,id:null,startedIso:null});$("#title").value="";render();
  await sendPending();
}
async function post(body){
  const r=await fetch(conf().url,{method:"POST",body:JSON.stringify(body)}); // text/plain: no CORS preflight
  return r.json();
}
let sending=false;
async function sendPending(){
  if(sending||!S.pending.length)return;sending=true;msg(`Sending ${S.pending.length===1?"the recording":S.pending.length+" recordings"}…`);
  const sent=[];let err=null;
  for(const p of S.pending){try{const j=await post({...p,key:conf().key});if(j&&j.ok)sent.push(p);else err=j&&j.error==="bad_key"?"The secret key doesn't match. Check Settings.":"The inbox rejected it ("+(j&&j.error||"unknown")+").";}catch(e){err="No connection to the inbox. It's saved on this phone and will resend.";}}
  S.pending=S.pending.filter(p=>!sent.includes(p));store.set("mr-pending",S.pending);sending=false;
  if(!S.pending.length)msg(`<b>Sent.</b> Open Meeting Recorder in Claude and tap <b>Create notes</b> on the new recording.`,"ok");
  else msg(esc(err||"Not sent yet.")+` <button class="btn sm" id="retry">Try again</button> <button class="btn sm ghost" id="copy">Copy transcript</button>`,"err");
  render();
}
window.addEventListener("online",sendPending);

function renderTx(){const tx=$("#tx");const show=S.status!=="idle";tx.classList.toggle("hidden",!show);if(!show)return;
  const near=tx.scrollHeight-tx.scrollTop-tx.clientHeight<60;
  tx.innerHTML=S.segs.map(s=>esc(s.text)).join(" ")+(S.interim?` <span class="interim">${esc(S.interim)}</span>`:"")||'<span class="muted">Listening…</span>';
  if(near)tx.scrollTop=tx.scrollHeight;}
function render(){
  const live=S.status==="recording";
  $("#big").className="big"+(live?" live":"");$("#big").innerHTML=live?PAUSE:MIC;$("#big").setAttribute("aria-label",live?"Pause":S.status==="paused"?"Resume":"Start recording");
  $("#state").textContent=live?"Recording and transcribing":S.status==="paused"?"Paused":S.pending.length?`${S.pending.length} waiting to send`:"Ready";
  $("#clock").textContent=fmt(elapsed());
  $("#controls").innerHTML=S.status!=="idle"?`<button class="btn primary" id="end">End &amp; send to Claude</button><button class="btn ghost" id="discard">Discard</button>`:"";
  document.querySelectorAll("[data-type]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.type===S.type));
  $("#setup").style.opacity=S.status==="idle"?1:.6;
  renderTx();
}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if(t.id==="big"){S.status==="recording"?pause():start();}
  else if(t.id==="end")finish();else if(t.id==="discard")discard();else if(t.id==="retry")sendPending();
  else if(t.id==="copy"){navigator.clipboard&&navigator.clipboard.writeText(S.pending.map(p=>p.title+"\n"+p.transcript).join("\n\n")).then(()=>t.textContent="Copied");}
  else if(t.dataset.type&&S.status==="idle"){S.type=t.dataset.type;render();}
  else if(t.id==="setBtn"){const s=$("#settings");s.classList.toggle("hidden");$("#url").value=conf().url||"";$("#key").value=conf().key||"";}
  else if(t.id==="saveSet"){store.set("mr-conf",{url:$("#url").value.trim(),key:$("#key").value.trim()});$("#setMsg").textContent="Saved.";sendPending();}
  else if(t.id==="testSet"){$("#setMsg").textContent="Testing…";store.set("mr-conf",{url:$("#url").value.trim(),key:$("#key").value.trim()});
    post({key:conf().key,ping:true}).then(j=>{$("#setMsg").textContent=j.error==="bad_key"?"Reached the inbox, but the key is wrong.":j.error==="empty"?"Connected – key accepted.":"Response: "+JSON.stringify(j);}).catch(()=>{$("#setMsg").textContent="Couldn't reach that URL.";});}
});
$("#title").addEventListener("input",()=>{if(S.status!=="idle")saveDraft();});
if(!conf().url)$("#settings").classList.remove("hidden"),$("#url").value="",$("#key").value="";
render();sendPending();
</script>
</body>
</html>
